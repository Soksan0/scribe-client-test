[project]
name = "scribe-research-qa"
version = "0.1.0"
description = "Privacy-first local research dataset quality assurance"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "certifi>=2025.1",
  "polars>=1.20,<2",
  "openpyxl>=3.1,<4",
  "pyreadstat>=1.2,<2",
  "pyreadr>=0.5,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["app*", "db*", "drizzle*", "worker*", "node_modules*"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
